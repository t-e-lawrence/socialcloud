name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check src/
      - run: ruff format --check src/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Import smoke test
        run: |
          python -c "import socialcloud.analysis.embeddings"
          python -c "import socialcloud.analysis.communities"
          python -c "import socialcloud.analysis.server"
          python -c "import socialcloud.analysis.visualize"
          python -c "import socialcloud.gender_detection.main"
      - name: Run pytest
        run: pytest -q || [ $? -eq 5 ]
